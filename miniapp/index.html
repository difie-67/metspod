<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#004EA3" />
    <meta name="description" content="OBRA GUARANT — безопасные сделки в TON" />
    <title>OBRA GUARANT</title>
    <link rel="stylesheet" href="/miniapp/styles.css?v=20260921-1" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script defer src="/miniapp/app.js?v=20260921-1"></script>
  </head>
  <body>
    <div class="bg-glyphs" aria-hidden="true"><i>＋</i><i>✓</i><i>◎</i><i>↗</i><i>◎</i><i>＋</i><i>✓</i></div>
    <div id="app">
      <header class="topbar">
        <button class="brand" data-route="home" aria-label="На главную">
          <span class="brand-mark">O</span>
          <span><b>OBRA</b><small>GUARANT</small></span>
        </button>
        <button id="wallet-pill" class="wallet-pill" data-route="profile">Кошелёк</button>
      </header>

      <main id="view" aria-live="polite">
        <section class="loading-screen">
          <div class="loader"></div>
          <p>Проверяем защищённую сессию…</p>
        </section>
      </main>

      <footer id="site-footer" class="site-footer"></footer>

      <nav id="tabbar" class="tabbar" aria-label="Основная навигация">
        <button data-route="home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span>Главная</button>
        <button data-route="deals"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg></span>Сделки</button>
        <button data-route="create" class="tab-create"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></span>Создать</button>
        <button data-route="transparency"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 14.5 14.5 9M7.25 16.75l-1 1a3.18 3.18 0 0 1-4.5-4.5l3.5-3.5a3.18 3.18 0 0 1 4.5 0M16.75 7.25l1-1a3.18 3.18 0 0 1 4.5 4.5l-3.5 3.5a3.18 3.18 0 0 1-4.5 0"/></svg></span>On-chain</button>
        <button data-route="profile"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span>Профиль</button>
      </nav>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <div id="modal" class="modal" hidden></div>
  </body>
</html>
